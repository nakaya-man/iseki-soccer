<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>欧州サッカー移籍ウォッチ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --text: #0F172A;
    --body: #334155;
    --muted: #64748B;
    --positive: #00A868;
    --positive-bg: #E5F8F0;
    --rumor: #B7791F;
    --rumor-bg: #FBF1DC;
    --accent: #0284C7;
    --navy: #1E293B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html{ scroll-behavior: smooth; }
  body{
    background: var(--bg);
    color: var(--body);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  button, select, input{ font-family: inherit; }
  a{ color: inherit; }

  /* breaking ticker */
  .ticker-wrap{
    background: var(--navy);
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker{
    display:inline-block;
    padding: 8px 0;
    animation: scroll 34s linear infinite;
  }
  .ticker-wrap:active .ticker{ animation-play-state: paused; }
  .ticker span{
    display:inline-block;
    padding: 0 26px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: #E5F8F0;
  }
  .ticker span b{ font-weight: 800; color: #4ADE9C; }
  @keyframes scroll{ 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

  /* header */
  header.hero{
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px 22px;
  }
  .hero-inner{ max-width: 1100px; margin: 0 auto; }
  .site-title{
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.2;
  }
  .site-title .ball{ color: var(--positive); font-size: 24px; }
  .site-sub{
    margin-top: 9px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.75;
    max-width: 640px;
  }
  .demo-flag{
    display:inline-block;
    margin-top: 12px;
    padding: 4px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* control bar */
  .control-bar{
    position: sticky; top: 0; z-index: 20;
    background: rgba(245,247,250,0.95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 13px 20px 11px;
  }
  .control-inner{ max-width: 1100px; margin: 0 auto; }

  .search-row{ display:flex; gap: 8px; align-items:center; }
  .search-row input[type=text]{
    flex:1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 8px;
    min-height: 42px;
  }
  .search-row input[type=text]:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-row input[type=text]::placeholder{ color: var(--muted); }

  .filter-group{ margin-top: 10px; }
  .filter-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .chip-scroll{
    display:flex; gap:7px; overflow-x:auto; padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--body);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 999px;
    min-height: 34px;
    display:flex; align-items:center;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .chip.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
    font-weight: 700;
  }
  .chip[data-rel="confirmed"].active{ background: var(--positive); border-color: var(--positive); }
  .chip[data-rel="strong"].active,
  .chip[data-rel="rumor"].active{ background: var(--rumor); border-color: var(--rumor); }

  main{ max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; }

  .result-count{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .feed{ display: flex; flex-direction: column; gap: 10px; }
  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .card.confirmed{ border-left: 3px solid var(--positive); }
  .card.strong, .card.rumor{ border-left: 3px solid var(--rumor); }

  .card-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 11px;
  }
  .badge{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .badge.confirmed{ background: var(--positive-bg); color: var(--positive); }
  .badge.strong{ background: var(--rumor-bg); color: var(--rumor); }
  .badge.rumor{ background: var(--rumor-bg); color: var(--rumor); opacity: 0.85; }

  .time{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .player{
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
    margin-bottom: 8px;
  }
  .route{
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .route .flag{ font-size: 15px; }
  .route .arrow{ color: var(--accent); font-weight: 700; font-size: 15px; }
  .route .from{ color: var(--muted); font-weight: 500; }
  .route .to{ color: var(--text); font-weight: 700; }

  .league-line{
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .league-line .flag{ font-size: 12px; }
  .league-line .arrow{ color: var(--muted); }

  .fee-line{
    margin-top: 9px;
    font-size: 13.5px;
    color: var(--body);
  }
  .fee-line b{ color: var(--text); }

  .source-line{
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
  }
  .source-line a{ color: var(--accent); text-decoration: none; }
  .source-line a:active{ opacity: 0.7; }

  .empty{ color:var(--muted); font-size:14px; padding: 40px 16px; text-align:center; line-height: 1.8; }

  footer{
    max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px;
    color: var(--muted); font-size: 11px; line-height: 1.9;
    border-top: 1px solid var(--border);
  }

  @media (min-width: 640px){
    .site-title{ font-size: 36px; }
    .player{ font-size: 23px; }
    .route{ font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce){ .ticker{ animation: none; } }
</style>
</head>
<body>

  <div class="ticker-wrap" aria-label="速報ティッカー">
    <div class="ticker mono" id="tickerTrack"></div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <div class="site-title"><span class="ball">⚽</span>欧州サッカー移籍ウォッチ</div>
      <p class="site-sub">海外メディアの移籍報道・噂を信頼度別に整理してお届け。一次情報のリンクは必ず併記します。</p>
      <div class="demo-flag">最終更新は毎朝自動反映されます</div>
    </div>
  </header>

  <div class="control-bar">
    <div class="control-inner">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="選手名・クラブ名で検索" inputmode="search">
      </div>

      <div class="filter-group">
        <div class="filter-label">🏆 リーグ</div>
        <div class="chip-scroll" id="leagueChips">
          <button class="chip active" data-league="all">全リーグ</button>
          <button class="chip" data-league="PL">プレミア</button>
          <button class="chip" data-league="LaLiga">ラ・リーガ</button>
          <button class="chip" data-league="SerieA">セリエA</button>
          <button class="chip" data-league="Bundesliga">ブンデス</button>
          <button class="chip" data-league="Ligue1">リーグ・アン</button>
          <button class="chip" data-league="Portugal">ポルトガル</button>
          <button class="chip" data-league="Netherlands">オランダ</button>
          <button class="chip" data-league="Scotland">スコットランド</button>
          <button class="chip" data-league="MLS">MLS</button>
          <button class="chip" data-league="Jleague">Jリーグ</button>
        </div>
      </div>

      <div class="filter-group" id="clubFilterGroup" style="display:none;">
        <div class="filter-label">🏟️ チーム</div>
        <div class="chip-scroll" id="clubChips"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">📊 移籍ステータス</div>
        <div class="chip-scroll" id="reliabilityChips">
          <button class="chip active" data-rel="all">すべて</button>
          <button class="chip" data-rel="confirmed">移籍決定</button>
          <button class="chip" data-rel="strong">有力</button>
          <button class="chip" data-rel="rumor">噂</button>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="result-count" id="resultCount"></div>
    <div class="feed" id="feed"></div>
  </main>

  <footer>
    掲載情報はすべて出典元メディアの報道に基づく要約であり、本サイトの独自見解を含みます。詳細・一次情報は各記事の出典リンクよりご確認ください。移籍市場は流動的なため、確定前の情報は変更される可能性があります。
  </footer>

<script>
const relLabel = { confirmed:'移籍決定', strong:'有力', rumor:'噂' };
const relDot = { confirmed:'🟢', strong:'🟡', rumor:'🟡' };
const leagueLabel = { PL:'プレミアリーグ', LaLiga:'ラ・リーガ', SerieA:'セリエA', Bundesliga:'ブンデスリーガ', Ligue1:'リーグ・アン', Portugal:'プリメイラ・リーガ', Netherlands:'エールディヴィジ', Scotland:'スコティッシュプレミア', MLS:'MLS', Jleague:'Jリーグ' };
const leagueFlag = { PL:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', LaLiga:'🇪🇸', SerieA:'🇮🇹', Bundesliga:'🇩🇪', Ligue1:'🇫🇷', Portugal:'🇵🇹', Netherlands:'🇳🇱', Scotland:'🏴', MLS:'🇺🇸', Jleague:'🇯🇵' };

let state = { rel:'all', league:'all', club:'all', q:'' };
let DATA = [];

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diffMs / 3600000);
  if(h < 1) return '1時間以内';
  if(h < 24) return `${h}時間前`;
  return `${Math.floor(h/24)}日前`;
}

function renderTicker(){
  const track = document.getElementById('tickerTrack');
  const tItems = DATA.filter(d => d.reliability !== 'rumor')
    .map(d => `<span><b>${relLabel[d.reliability]}</b> ${d.player} → ${d.to_club}</span>`);
  track.innerHTML = tItems.join('') + tItems.join('');
}

function renderClubChips(){
  const group = document.getElementById('clubFilterGroup');
  const clubChips = document.getElementById('clubChips');

  if(state.league === 'all'){
    group.style.display = 'none';
    return;
  }

  const clubs = new Set();
  DATA.forEach(d => {
    if(d.league !== state.league) return;
    if(d.to_club) clubs.add(d.to_club);
  });

  if(clubs.size === 0){
    group.style.display = 'none';
    return;
  }

  group.style.display = 'block';
  const sorted = Array.from(clubs).sort((a,b) => a.localeCompare(b, 'ja'));
  clubChips.innerHTML = `<button class="chip active" data-club="all">すべて</button>` +
    sorted.map(c => `<button class="chip" data-club="${c}">${c}</button>`).join('');
}

function render(){
  const rows = DATA.filter(d => {
    if(state.rel !== 'all' && d.reliability !== state.rel) return false;
    if(state.league !== 'all' && d.league !== state.league) return false;
    if(state.club !== 'all' && d.to_club !== state.club) return false;
    if(state.q && !((d.player||'').toLowerCase().includes(state.q) || (d.from_club||'').toLowerCase().includes(state.q) || (d.to_club||'').toLowerCase().includes(state.q))) return false;
    return true;
  }).sort((a,b) => new Date(b.published) - new Date(a.published));

  document.getElementById('resultCount').textContent = `${rows.length}件の情報`;

  document.getElementById('feed').innerHTML = rows.map(d => {
    const fromFlag = leagueFlag[d.from_league] || '';
    const toFlag = leagueFlag[d.to_league] || '';
    const hasLeagueInfo = d.from_league || d.to_league;
    return `
    <div class="card ${d.reliability}">
      <div class="card-top">
        <span class="badge ${d.reliability}">${relDot[d.reliability]} ${relLabel[d.reliability]}</span>
        <span class="time">${timeAgo(d.published)}</span>
      </div>
      <div class="player">${d.player}</div>
      <div class="route">
        ${fromFlag ? `<span class="flag">${fromFlag}</span>` : ''}<span class="from">${d.from_club}</span>
        <span class="arrow">→</span>
        ${toFlag ? `<span class="flag">${toFlag}</span>` : ''}<span class="to">${d.to_club}</span>
      </div>
      ${hasLeagueInfo ? `
      <div class="league-line">
        ${fromFlag ? `<span class="flag">${fromFlag}</span>` : ''}<span>${leagueLabel[d.from_league] || (d.from_league ? d.from_league : '不明')}</span>
        <span class="arrow">→</span>
        ${toFlag ? `<span class="flag">${toFlag}</span>` : ''}<span>${leagueLabel[d.to_league] || (d.to_league ? d.to_league : '不明')}</span>
      </div>` : ''}
      ${d.fee ? `<div class="fee-line">移籍金: <b>${d.fee}</b></div>` : ''}
      <div class="source-line">
        <a href="${d.link}" target="_blank" rel="noopener">情報ソース: ${d.source_name} ↗</a>
      </div>
    </div>
  `;
  }).join('') || `<div class="empty">該当する情報がありません。<br>絞り込み条件を変えてお試しください。</div>`;
}

document.getElementById('reliabilityChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#reliabilityChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.rel = btn.dataset.rel;
  render();
});
document.getElementById('leagueChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#leagueChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.league = btn.dataset.league;
  state.club = 'all';
  renderClubChips();
  render();
});
document.getElementById('clubChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#clubChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.club = btn.dataset.club;
  render();
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

fetch('./data/articles.json')
  .then(res => res.json())
  .then(data => {
    DATA = data;
    renderTicker();
    render();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = `<div class="empty">データの読み込みに失敗しました。</div>`;
  });
</script>
</body>
</html>
