<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>移籍ウォッチ | 欧州サッカー移籍情報まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0A1220;
    --navy-2: #121D31;
    --pitch: #1E6B45;
    --pitch-bright: #34B378;
    --gold: #EFC24E;
    --ink: #F6F4EC;
    --ink-dim: #D3D9E3;
    --slate: #9CA7B8;
    --line: #26344C;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html{ scroll-behavior: smooth; }
  body{
    background: var(--navy);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  button, select, input{ font-family: inherit; }

  .ticker-wrap{
    background: var(--pitch);
    border-bottom: 1px solid #14432B;
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker{
    display:inline-block;
    padding: 10px 0;
    animation: scroll 34s linear infinite;
  }
  .ticker-wrap:active .ticker{ animation-play-state: paused; }
  .ticker span{
    display:inline-block;
    padding: 0 26px;
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: #EAF7F0;
  }
  .ticker span b{ color: #FFE9A8; font-weight: 600; }
  @keyframes scroll{ 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

  .control-bar{
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,18,32,0.96);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .search-row{ display:flex; gap: 8px; align-items:center; }
  .search-row input[type=text]{
    flex:1;
    background: var(--navy-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    min-height: 46px;
  }
  .search-row input[type=text]:focus{ outline: 2px solid var(--pitch-bright); outline-offset: 1px; }
  .search-row input[type=text]::placeholder{ color: var(--slate); }

  .chip-scroll{
    display:flex; gap:8px; overflow-x:auto; padding: 10px 0 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chip-scroll::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    background: var(--navy-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 15px;
    border-radius: 999px;
    min-height: 40px;
    display:flex; align-items:center;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .chip.active{
    background: var(--pitch);
    border-color: var(--pitch-bright);
    color: #F2FFF7;
  }
  .chip .dot{ width:7px; height:7px; border-radius:50%; margin-right:7px; display:inline-block; }
  .dot.confirmed{ background: var(--pitch-bright); }
  .dot.strong{ background: var(--gold); }
  .dot.rumor{ background: var(--slate); }

  header.hero{
    padding: 28px 16px 20px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(ellipse at top left, rgba(52,179,120,0.15), transparent 55%),
      var(--navy);
  }
  .hero-inner{ max-width: 720px; margin: 0 auto; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--pitch-bright);
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  h1{
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 30px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--ink);
  }
  h1 em{ font-style: normal; color: var(--gold); }
  .hero-sub{
    margin-top: 10px;
    color: var(--slate);
    font-size: 14px;
    line-height: 1.75;
  }
  .demo-flag{
    display:inline-block;
    margin-top: 14px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--slate);
  }

  main{ max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }

  .result-count{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    margin-bottom: 14px;
    padding-left: 2px;
  }

  .feed{ display: flex; flex-direction: column; gap: 12px; }
  .card{
    background: var(--navy-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .card.confirmed{ border-left: 4px solid var(--pitch-bright); }
  .card.strong{ border-left: 4px solid var(--gold); }
  .card.rumor{ border-left: 4px solid var(--slate); }

  .card-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 10px;
  }
  .reliability{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .reliability.confirmed{ background: rgba(52,179,120,0.16); color: var(--pitch-bright); }
  .reliability.strong{ background: rgba(239,194,78,0.16); color: var(--gold); }
  .reliability.rumor{ background: rgba(156,167,184,0.16); color: var(--slate); }

  .time{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--slate);
  }

  .player{
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .route{
    margin-top: 4px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-dim);
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .route .arrow{ color: var(--pitch-bright); }
  .route .to{ color: var(--ink); font-weight: 700; }

  .summary{
    margin-top: 10px;
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--ink-dim);
  }

  .meta{
    margin-top: 12px;
    display:flex; gap: 8px; flex-wrap: wrap; align-items:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }
  .meta .tag{
    border: 1px solid var(--line);
    padding: 4px 9px;
    border-radius: 999px;
    color: var(--slate);
  }
  .meta a{ color: var(--pitch-bright); text-decoration: none; padding: 4px 2px; }
  .meta a:active{ opacity: 0.7; }

  .empty{ color:var(--slate); font-size:14px; padding: 40px 16px; text-align:center; line-height: 1.8; }

  footer{
    max-width: 720px; margin: 0 auto; padding: 24px 16px 60px;
    color: var(--slate); font-size: 11.5px; line-height: 1.9;
    border-top: 1px solid var(--line);
  }

  @media (min-width: 640px){
    h1{ font-size: 36px; }
    .search-row input[type=text]{ font-size: 14px; }
    .player{ font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce){ .ticker{ animation: none; } }
</style>
</head>
<body>

  <div class="ticker-wrap" aria-label="速報ティッカー">
    <div class="ticker mono" id="tickerTrack"></div>
  </div>

  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">TRANSFER WINDOW · EUROPE</div>
      <h1>欧州サッカー<em>移籍</em>ウォッチ</h1>
      <p class="hero-sub">海外メディアの移籍報道・噂を信頼度別に整理。一次情報のリンクは必ず併記します。</p>
      <div class="demo-flag">※ デザイン確認用のサンプルデータです</div>
    </div>
  </header>

  <div class="control-bar">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="選手名・クラブ名で検索" inputmode="search">
    </div>
    <div class="chip-scroll" id="reliabilityChips">
      <button class="chip active" data-rel="all">すべて</button>
      <button class="chip" data-rel="confirmed"><span class="dot confirmed"></span>確定</button>
      <button class="chip" data-rel="strong"><span class="dot strong"></span>有力</button>
      <button class="chip" data-rel="rumor"><span class="dot rumor"></span>噂</button>
    </div>
    <div class="chip-scroll" id="leagueChips">
      <button class="chip active" data-league="all">全リーグ</button>
      <button class="chip" data-league="PL">プレミア</button>
      <button class="chip" data-league="LaLiga">ラ・リーガ</button>
      <button class="chip" data-league="SerieA">セリエA</button>
      <button class="chip" data-league="Bundesliga">ブンデス</button>
      <button class="chip" data-league="Ligue1">リーグ・アン</button>
      <button class="chip" data-league="Portugal">ポルトガル</button>
      <button class="chip" data-league="Netherlands">オランダ</button>
      <button class="chip" data-league="Scotland">スコットランド</button>
      <button class="chip" data-league="MLS">MLS</button>
      <button class="chip" data-league="Jleague">Jリーグ</button>
    </div>
  </div>

  <main>
    <div class="result-count" id="resultCount"></div>
    <div class="feed" id="feed"></div>
  </main>

  <footer>
    掲載情報はすべて出典元メディアの報道に基づく要約であり、本サイトの独自見解を含みます。詳細・一次情報は各記事の出典リンクよりご確認ください。移籍市場は流動的なため、確定前の情報は変更される可能性があります。
  </footer>

<script>
const relLabel = { confirmed:'確定', strong:'有力', rumor:'噂' };
const leagueLabel = { PL:'プレミアリーグ', LaLiga:'ラ・リーガ', SerieA:'セリエA', Bundesliga:'ブンデスリーガ', Ligue1:'リーグ・アン', Portugal:'プリメイラ・リーガ', Netherlands:'エールディヴィジ', Scotland:'スコティッシュプレミア', MLS:'MLS', Jleague:'Jリーグ' };

let state = { rel:'all', league:'all', q:'' };
let DATA = [];

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diffMs / 3600000);
  if(h < 1) return '1時間以内';
  if(h < 24) return `${h}時間前`;
  return `${Math.floor(h/24)}日前`;
}

function renderTicker(){
  const track = document.getElementById('tickerTrack');
  const tItems = DATA.filter(d => d.reliability !== 'rumor')
    .map(d => `<span><b>${relLabel[d.reliability]}</b> ${d.player} → ${d.to_club}</span>`);
  track.innerHTML = tItems.join('') + tItems.join('');
}

function render(){
  const rows = DATA.filter(d => {
    if(state.rel !== 'all' && d.reliability !== state.rel) return false;
    if(state.league !== 'all' && d.league !== state.league) return false;
    if(state.q && !((d.player||'').toLowerCase().includes(state.q) || (d.from_club||'').toLowerCase().includes(state.q) || (d.to_club||'').toLowerCase().includes(state.q))) return false;
    return true;
  }).sort((a,b) => new Date(b.published) - new Date(a.published));

  document.getElementById('resultCount').textContent = `${rows.length}件の情報`;

  document.getElementById('feed').innerHTML = rows.map(d => `
    <div class="card ${d.reliability}">
      <div class="card-top">
        <span class="reliability ${d.reliability}">${relLabel[d.reliability]}</span>
        <span class="time">${timeAgo(d.published)}</span>
      </div>
      <div class="player">${d.player}</div>
      <div class="route">
        <span>${d.from_club}</span>
        <span class="arrow">→</span>
        <span class="to">${d.to_club}</span>
      </div>
      ${d.fee ? `<div class="summary">移籍金: ${d.fee}</div>` : ''}
      <div class="meta">
        <span class="tag">${leagueLabel[d.league] || d.league}</span>
        <a href="${d.link}" target="_blank" rel="noopener">出典: ${d.source_name} ↗</a>
      </div>
    </div>
  `).join('') || `<div class="empty">該当する情報がありません。<br>絞り込み条件を変えてお試しください。</div>`;
}

document.getElementById('reliabilityChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#reliabilityChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.rel = btn.dataset.rel;
  render();
});
document.getElementById('leagueChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('#leagueChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  state.league = btn.dataset.league;
  render();
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

fetch('./data/articles.json')
  .then(res => res.json())
  .then(data => {
    DATA = data;
    renderTicker();
    render();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = `<div class="empty">データの読み込みに失敗しました。</div>`;
  });
</script>
</body>
</html>
