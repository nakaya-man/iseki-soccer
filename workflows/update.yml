name: 移籍情報の自動更新

on:
  schedule:
    # 毎日 UTC 22:00 = 日本時間 朝7:00 に自動実行
    - cron: "0 22 * * *"
  workflow_dispatch:
    # 手動で今すぐ実行したいときはGitHubの画面から「Run workflow」を押す

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なパッケージをインストール
        run: pip install -r requirements.txt

      - name: 海外メディアから情報収集(RSS)
        run: python scripts/collect.py

      - name: Fabrizio Romano等の投稿を収集(X API)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/collect_x.py

      - name: AIで日本語要約・信頼度判定
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py

      - name: 更新内容を保存(コミット)
        run: |
          git config user.name "iseki-soccer-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "自動更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
